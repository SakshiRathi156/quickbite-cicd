# AWS CodeDeploy instructions for the QuickBite API (EC2, in-place rolling deployment).
# The deployment group uses CodeDeployDefault.OneAtATime, so servers are taken out of
# the load balancer and updated one by one — QuickBite stays online throughout.
version: 0.0
os: linux

files:
  - source: /
    destination: /opt/quickbite/app
file_exists_behavior: OVERWRITE

hooks:
  ApplicationStop:
    - location: scripts/stop_server.sh
      timeout: 60
      runas: root
  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 60
      runas: root
  AfterInstall:
    - location: scripts/after_install.sh
      timeout: 300
      runas: root
  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 60
      runas: root
  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 120
      runas: root
