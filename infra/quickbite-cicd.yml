AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  QuickBite CI/CD on AWS. GitHub -> CodePipeline -> CodeBuild (build, test) ->
  CodeDeploy rolling deploy to an EC2 Auto Scaling group (Node.js API) and
  S3 + CloudFront (React frontend), with CloudWatch alarms, automatic rollback
  and SNS email alerts. Optional Amazon RDS MySQL database.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Source code }
        Parameters: [GitHubOwner, GitHubRepo, BranchName]
      - Label: { default: Network }
        Parameters: [VpcId, SubnetIds]
      - Label: { default: Application }
        Parameters: [InstanceType, DesiredCapacity, CreateDatabase]
      - Label: { default: Alerts }
        Parameters: [NotificationEmail]

Parameters:
  GitHubOwner:
    Type: String
    Description: GitHub user or organisation that owns the repository
  GitHubRepo:
    Type: String
    Default: quickbite-cicd
    Description: Repository name
  BranchName:
    Type: String
    Default: main
    Description: A push to this branch starts the pipeline
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to use (the default VPC is fine)
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >-
      At least two PUBLIC subnets in different Availability Zones (the default
      VPC's subnets work). Servers need internet access to install Node.js.
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t3.medium]
  DesiredCapacity:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 4
    Description: Number of API servers (2+ shows a rolling deployment)
  CreateDatabase:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      Create an RDS MySQL database. Choose false to save cost: the API then uses
      an in-memory store (orders are lost on restart and not shared between servers).
  NotificationEmail:
    Type: String
    Description: Email for pipeline failure, deployment rollback and alarm notifications
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Amazon Linux 2023 AMI (leave as default)

Conditions:
  HasDatabase: !Equals [!Ref CreateDatabase, 'true']

Resources:
  # ------------------------------------------------------------------ Alerts
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: QuickBite alerts
      Subscription:
        - Protocol: email
          Endpoint: !Ref NotificationEmail

  AlertsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlertsTopic]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountPublish
            Effect: Allow
            Principal: { AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' }
            Action: sns:Publish
            Resource: !Ref AlertsTopic
          - Sid: PipelineNotifications
            Effect: Allow
            Principal: { Service: codestar-notifications.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref AlertsTopic
          - Sid: CloudWatchAlarms
            Effect: Allow
            Principal: { Service: cloudwatch.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref AlertsTopic

  # ------------------------------------------------------------------ Storage
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      VersioningConfiguration: { Status: Enabled }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldArtifacts
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration: { NoncurrentDays: 7 }

  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  # ------------------------------------------------------------------ Network security
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: QuickBite load balancer - HTTP from the internet / CloudFront
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: QuickBite API servers - port 3000 from the load balancer only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref AlbSecurityGroup

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: HasDatabase
    Properties:
      GroupDescription: QuickBite MySQL - port 3306 from the API servers only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref AppSecurityGroup

  # ------------------------------------------------------------------ Database (optional)
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Condition: HasDatabase
    Properties:
      DBSubnetGroupDescription: QuickBite database subnets
      SubnetIds: !Ref SubnetIds

  Database:
    Type: AWS::RDS::DBInstance
    Condition: HasDatabase
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Engine: mysql
      DBInstanceClass: db.t3.micro
      AllocatedStorage: '20'
      StorageType: gp3
      StorageEncrypted: true
      DBName: quickbite
      MasterUsername: quickbite
      ManageMasterUserPassword: true # password lives in Secrets Manager, never in this template
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 1
      DeletionProtection: false

  # ------------------------------------------------------------------ Load balancer
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref AlbSecurityGroup]

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 3000
      TargetType: instance
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ------------------------------------------------------------------ API servers
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore' # shell access via Session Manager
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/CloudWatchAgentServerPolicy'
      Policies:
        - PolicyName: quickbite-instance
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadDeploymentBundles
                Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource:
                  - !Sub '${ArtifactBucket.Arn}/*'
                  - !Sub 'arn:${AWS::Partition}:s3:::aws-codedeploy-${AWS::Region}/*'
              - Sid: ReadDatabaseSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !If
                  - HasDatabase
                  - !GetAtt Database.MasterUserSecret.SecretArn
                  - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:quickbite-none'

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile: { Arn: !GetAtt InstanceProfile.Arn }
        SecurityGroupIds: [!Ref AppSecurityGroup]
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 2
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - { Key: Name, Value: quickbite-api }
        UserData:
          Fn::Base64: !Sub
            - |
              #!/bin/bash
              # Prepares a fresh server. The app itself arrives later via CodeDeploy.
              set -euxo pipefail
              dnf install -y ruby wget tar xz
              NODE_VERSION=20.18.1
              curl -fsSL "https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-linux-x64.tar.xz" \
                | tar -xJ -C /usr/local --strip-components=1
              node --version
              id quickbite || useradd --system --home /opt/quickbite --shell /sbin/nologin quickbite
              mkdir -p /opt/quickbite /etc/quickbite
              cat > /etc/quickbite/infra.env <<EOF
              AWS_REGION=${AWS::Region}
              DB_HOST=${DbHost}
              DB_SECRET_ARN=${DbSecretArn}
              EOF
              cd /tmp
              wget -q "https://aws-codedeploy-${AWS::Region}.s3.${AWS::Region}.amazonaws.com/latest/install"
              chmod +x ./install
              ./install auto
              systemctl enable --now codedeploy-agent
            - DbHost: !If [HasDatabase, !GetAtt Database.Endpoint.Address, '']
              DbSecretArn: !If [HasDatabase, !GetAtt Database.MasterUserSecret.SecretArn, '']

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      VPCZoneIdentifier: !Ref SubnetIds
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      MinSize: '1'
      MaxSize: '4'
      DesiredCapacity: !Ref DesiredCapacity
      TargetGroupARNs: [!Ref TargetGroup]
      # EC2 health checks: servers start without the app until the first deployment,
      # so ELB health checks would terminate them in a loop. The load balancer still
      # only routes traffic to targets that pass /api/health.
      HealthCheckType: EC2
      HealthCheckGracePeriod: 300

  # Handles the lunch and dinner rush (slide 15).
  CpuScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: 60

  # ------------------------------------------------------------------ Frontend CDN
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-frontend-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: QuickBite web app
        DefaultRootObject: index.html
        PriceClass: PriceClass_200
        HttpVersion: http2
        Origins:
          - Id: frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: '' }
          - Id: api
            DomainName: !GetAtt LoadBalancer.DNSName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
        DefaultCacheBehavior:
          TargetOriginId: frontend
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader

  # ------------------------------------------------------------------ Monitoring
  # Watched by CodeDeploy during deployments: if it fires, the deployment stops and rolls back.
  ApiErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: QuickBite API is returning server errors (5xx)
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  UnhealthyHostsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: One or more QuickBite API servers are failing health checks
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt TargetGroup.TargetGroupFullName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # ------------------------------------------------------------------ CodeDeploy (backend)
  CodeDeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codedeploy.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSCodeDeployRole'

  CodeDeployApp:
    Type: AWS::CodeDeploy::Application
    Properties:
      ComputePlatform: Server

  DeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref CodeDeployApp
      ServiceRoleArn: !GetAtt CodeDeployRole.Arn
      DeploymentConfigName: CodeDeployDefault.OneAtATime # rolling: one server at a time
      AutoScalingGroups: [!Ref AutoScalingGroup]
      DeploymentStyle:
        DeploymentType: IN_PLACE
        DeploymentOption: WITH_TRAFFIC_CONTROL
      LoadBalancerInfo:
        TargetGroupInfoList:
          - Name: !GetAtt TargetGroup.TargetGroupName
      AlarmConfiguration:
        Enabled: true
        Alarms:
          - Name: !Ref ApiErrorAlarm
      AutoRollbackConfiguration:
        Enabled: true
        Events: [DEPLOYMENT_FAILURE, DEPLOYMENT_STOP_ON_ALARM]
      TriggerConfigurations:
        - TriggerName: notify-team
          TriggerTargetArn: !Ref AlertsTopic
          TriggerEvents: [DeploymentFailure, DeploymentRollback, DeploymentStop]

  # ------------------------------------------------------------------ CodeBuild
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: quickbite-codebuild
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*'
              - Sid: PipelineArtifacts
                Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject, s3:GetBucketLocation]
                Resource: [!GetAtt ArtifactBucket.Arn, !Sub '${ArtifactBucket.Arn}/*']
              - Sid: PublishFrontend
                Effect: Allow
                Action: [s3:ListBucket, s3:PutObject, s3:DeleteObject, s3:GetObject]
                Resource: [!GetAtt FrontendBucket.Arn, !Sub '${FrontendBucket.Arn}/*']
              - Sid: InvalidateCdn
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
              - Sid: TestReports
                Effect: Allow
                Action:
                  - codebuild:CreateReportGroup
                  - codebuild:CreateReport
                  - codebuild:UpdateReport
                  - codebuild:BatchPutTestCases
                  - codebuild:BatchPutCodeCoverages
                Resource: !Sub 'arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:report-group/*'

  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${AWS::StackName}-build'
      Description: QuickBite - install packages and build the React app
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Source: { Type: CODEPIPELINE, BuildSpec: buildspec/build.yml }
      Artifacts: { Type: CODEPIPELINE }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
      TimeoutInMinutes: 15

  TestProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${AWS::StackName}-test'
      Description: QuickBite - quality gate (unit + integration tests, coverage)
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Source: { Type: CODEPIPELINE, BuildSpec: buildspec/test.yml }
      Artifacts: { Type: CODEPIPELINE }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
      TimeoutInMinutes: 15

  FrontendDeployProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${AWS::StackName}-deploy-frontend'
      Description: QuickBite - sync the React build to S3 and refresh CloudFront
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts: { Type: CODEPIPELINE }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - { Name: FRONTEND_BUCKET, Value: !Ref FrontendBucket }
          - { Name: DISTRIBUTION_ID, Value: !Ref Distribution }
      TimeoutInMinutes: 10
      Source:
        Type: CODEPIPELINE
        BuildSpec: |
          version: 0.2
          phases:
            build:
              commands:
                # Hashed JS/CSS files can be cached for a year; index.html must always be fresh.
                - aws s3 sync . "s3://$FRONTEND_BUCKET" --delete --exclude index.html --cache-control "public,max-age=31536000,immutable"
                - aws s3 cp index.html "s3://$FRONTEND_BUCKET/index.html" --cache-control "no-cache"
                - aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"

  # ------------------------------------------------------------------ CodePipeline
  GitHubConnection:
    Type: AWS::CodeStarConnections::Connection
    Properties:
      ConnectionName: quickbite-github
      ProviderType: GitHub

  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codepipeline.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: quickbite-pipeline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: codestar-connections:UseConnection
                Resource: !Ref GitHubConnection
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject, s3:GetBucketVersioning, s3:GetBucketLocation]
                Resource: [!GetAtt ArtifactBucket.Arn, !Sub '${ArtifactBucket.Arn}/*']
              - Effect: Allow
                Action: [codebuild:StartBuild, codebuild:BatchGetBuilds]
                Resource:
                  - !GetAtt BuildProject.Arn
                  - !GetAtt TestProject.Arn
                  - !GetAtt FrontendDeployProject.Arn
              - Effect: Allow
                Action:
                  - codedeploy:CreateDeployment
                  - codedeploy:GetDeployment
                  - codedeploy:GetDeploymentConfig
                  - codedeploy:GetApplication
                  - codedeploy:GetApplicationRevision
                  - codedeploy:RegisterApplicationRevision
                Resource: '*'

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub '${AWS::StackName}-pipeline'
      RoleArn: !GetAtt PipelineRole.Arn
      PipelineType: V2
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: GitHub
              ActionTypeId: { Category: Source, Owner: AWS, Provider: CodeStarSourceConnection, Version: '1' }
              Configuration:
                ConnectionArn: !Ref GitHubConnection
                FullRepositoryId: !Sub '${GitHubOwner}/${GitHubRepo}'
                BranchName: !Ref BranchName
                DetectChanges: true
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts: [{ Name: SourceOutput }]
        - Name: Build
          Actions:
            - Name: BuildApp
              ActionTypeId: { Category: Build, Owner: AWS, Provider: CodeBuild, Version: '1' }
              Configuration: { ProjectName: !Ref BuildProject }
              InputArtifacts: [{ Name: SourceOutput }]
              OutputArtifacts: [{ Name: BackendBundle }, { Name: FrontendBundle }]
        - Name: Test
          Actions:
            - Name: QualityGate
              ActionTypeId: { Category: Test, Owner: AWS, Provider: CodeBuild, Version: '1' }
              Configuration: { ProjectName: !Ref TestProject }
              InputArtifacts: [{ Name: SourceOutput }]
        - Name: Deploy
          Actions:
            - Name: DeployApi
              RunOrder: 1
              ActionTypeId: { Category: Deploy, Owner: AWS, Provider: CodeDeploy, Version: '1' }
              Configuration:
                ApplicationName: !Ref CodeDeployApp
                DeploymentGroupName: !Ref DeploymentGroup
              InputArtifacts: [{ Name: BackendBundle }]
            - Name: DeployFrontend
              RunOrder: 2 # after the API, so the new UI never calls an API that isn't live yet
              ActionTypeId: { Category: Build, Owner: AWS, Provider: CodeBuild, Version: '1' }
              Configuration: { ProjectName: !Ref FrontendDeployProject }
              InputArtifacts: [{ Name: FrontendBundle }]

  PipelineNotifications:
    Type: AWS::CodeStarNotifications::NotificationRule
    Properties:
      Name: !Sub '${AWS::StackName}-pipeline-events'
      DetailType: BASIC
      Resource: !Sub 'arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}'
      EventTypeIds:
        - codepipeline-pipeline-pipeline-execution-failed
        - codepipeline-pipeline-pipeline-execution-succeeded
      Targets:
        - TargetType: SNS
          TargetAddress: !Ref AlertsTopic

Outputs:
  WebsiteUrl:
    Description: QuickBite - open this after the first successful pipeline run
    Value: !Sub 'https://${Distribution.DomainName}'
  LoadBalancerUrl:
    Description: Direct API URL (for debugging)
    Value: !Sub 'http://${LoadBalancer.DNSName}/api/health'
  GitHubConnectionArn:
    Description: Approve this connection in the console (Developer Tools > Connections) before the first run
    Value: !Ref GitHubConnection
  PipelineName:
    Value: !Ref Pipeline
  FrontendBucketName:
    Value: !Ref FrontendBucket
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
